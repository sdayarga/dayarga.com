<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Designer | Dayarga Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1d20; color: #fff; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        a.back-btn { color: #9aa0a6; text-decoration: none; display: inline-block; margin-bottom: 30px; font-weight: bold; }
        a.back-btn:hover { color: #fff; text-decoration: underline; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; }
        p.bio { font-size: 1.1rem; color: #ccc; margin-bottom: 40px; }

        /* 3 Зургийн Grid байршил */
        .image-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }

        /* Зураг + Эффект бүхий карт */
        .img-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #33373b;
            height: 300px;
            cursor: pointer;
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        /* Маус очиход зураг бага зэрэг томрох */
        .img-card:hover img {
            transform: scale(1.08);
        }

        /* Маус очиход гарч ирэх харанхуй дэвсгэр болон текст */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Маус аваачих үед текстыг харуулна */
        .img-card:hover .overlay {
            opacity: 1;
        }

        .overlay .year {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .overlay .desc {
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">&larr; Back to Home</a>
        <h1>The Designer</h1>
        <p class="bio">Lead Brand Identity & Logo Designer with 20+ years of experience crafting iconic visuals for leading brands.</p>

        <div class="image-grid">
            <!-- Зураг 1 -->
            <div class="img-card">
                <img src="pro1.jpg" alt="First Design">
                <div class="overlay">
                    <div class="year">2005 оны загвар</div>
                    <div class="desc">Анхны загвар ба дүр төрх</div>
                </div>
            </div>

            <!-- Зураг 2 -->
            <div class="img-card">
                <img src="pro2.jpg" alt="Second Design">
                <div class="overlay">
                    <div class="year">2015 оны загвар</div>
                    <div class="desc">Дараагийн шатны хөгжүүлэлт</div>
                </div>
            </div>

            <!-- Зураг 3 -->
            <div class="img-card">
                <img src="pro3.jpg" alt="Latest Design">
                <div class="overlay">
                    <div class="year">2026 оны загвар</div>
                    <div class="desc">Одоогийн бренд концепт</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
